<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WrapChat — Abstract UI</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(165deg, #C2D2EA 0%, #AEBFDC 50%, #A6BCDA 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', sans-serif;
    }

    .phone-wrap {
      filter:
        drop-shadow(0 60px 100px rgba(42,65,118,0.40))
        drop-shadow(0 22px 44px rgba(42,65,118,0.22))
        drop-shadow(0 6px 14px rgba(42,65,118,0.13));
    }
    .phone-outer {
      width: 360px;
      background: linear-gradient(158deg, #F9FBFF 0%, #ECF2FA 100%);
      border-radius: 54px;
      padding: 13px;
      box-shadow:
        inset 0 0 0 1.5px rgba(255,255,255,0.97),
        inset 0 2px 10px rgba(255,255,255,0.99);
    }
    .phone-screen {
      width: 334px;
      height: 700px;
      border-radius: 42px;
      overflow: hidden;
      position: relative;
      background: #3C1A8C;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      will-change: transform, opacity;
    }

    .bar { border-radius: 999px; flex-shrink: 0; }
    .geo { position: absolute; pointer-events: none; }

    /* ── Geo background drift ── */
    @keyframes geoDrift {
      0%, 100% { transform: rotate(var(--gr, 0deg)) translateY(0px);  }
      50%       { transform: rotate(var(--gr, 0deg)) translateY(-6px); }
    }
    .geo { animation: geoDrift 6s ease-in-out infinite; }

    /* ── Element animation keyframes ── */
    @keyframes aeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
    @keyframes aeScale {
      from { opacity: 0; transform: scale(0.82); }
      to   { opacity: 1; transform: scale(1);    }
    }
    @keyframes aeLeft {
      from { opacity: 0; transform: translateX(-18px); }
      to   { opacity: 1; transform: translateX(0);     }
    }
    @keyframes aeRight {
      from { opacity: 0; transform: translateX(18px); }
      to   { opacity: 1; transform: translateX(0);    }
    }
    @keyframes aeFade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes aeBarGrow {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }

    /* Default: elements hidden */
    .ae     { opacity: 0; will-change: transform, opacity; }
    .ae-bar { transform: scaleX(0); transform-origin: left center; will-change: transform; }

    /* Triggered when screen gets .active */
    .screen.active .ae {
      animation: aeUp 0.56s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: var(--d, 0ms);
    }
    .screen.active .ae[data-t="scale"] { animation-name: aeScale;  }
    .screen.active .ae[data-t="left"]  { animation-name: aeLeft;   }
    .screen.active .ae[data-t="right"] { animation-name: aeRight;  }
    .screen.active .ae[data-t="fade"]  { animation-name: aeFade;   }

    .screen.active .ae-bar {
      animation: aeBarGrow 0.72s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: var(--d, 0ms);
    }
  </style>
</head>

        <!-- share btn -->
        <div class="ae" data-t="left" style="--d:0ms; position:absolute;top:14px;left:14px;z-index:10;background:rgba(255,255,255,0.12);border-radius:999px;height:30px;padding:0 14px;display:flex;align-items:center;">
          <div class="bar" style="width:32px;height:7px;background:rgba(255,255,255,0.55);"></div>
        </div>

        <!-- close btn -->
        <div class="ae" data-t="right" style="--d:0ms; position:absolute;top:14px;right:14px;z-index:10;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;">
          <div style="font-size:14px;color:rgba(255,255,255,0.45);">✕</div>
        </div>

        <!-- section pill -->
        <div class="ae" data-t="scale" style="--d:70ms; display:flex;justify-content:center;padding-top:14px;position:relative;z-index:4;">
          <div style="background:rgba(106,180,240,0.22);border:1px solid rgba(106,180,240,0.50);padding:5px 18px;border-radius:999px;height:26px;display:flex;align-items:center;">
            <div class="bar" style="width:60px;height:7px;background:rgba(106,180,240,0.80);"></div>
          </div>
        </div>

        <!-- main content -->
        <div style="position:absolute;top:54px;bottom:48px;left:0;right:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 20px;gap:10px;z-index:2;">

          <!-- top 2 stat cards -->
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;">
            <div class="ae" data-t="left" style="--d:150ms; background:#1760C0;border-radius:20px;padding:16px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 20px rgba(8,32,90,0.40);">
              <div class="bar" style="width:52px;height:22px;background:rgba(255,255,255,0.72);border-radius:6px;"></div>
              <div class="bar" style="width:64px;height:6px;background:rgba(106,180,240,0.70);"></div>
            </div>
            <div class="ae" data-t="right" style="--d:210ms; background:#1760C0;border-radius:20px;padding:16px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 20px rgba(8,32,90,0.40);">
              <div class="bar" style="width:44px;height:22px;background:rgba(255,255,255,0.72);border-radius:6px;"></div>
              <div class="bar" style="width:56px;height:6px;background:rgba(106,180,240,0.70);"></div>
            </div>
          </div>

          <!-- bar chart card -->
          <div class="ae" style="--d:310ms; background:#1760C0;border-radius:20px;padding:16px;width:100%;box-shadow:0 8px 20px rgba(8,32,90,0.40);display:flex;flex-direction:column;gap:10px;">
            <div class="bar" style="width:130px;height:7px;background:rgba(255,255,255,0.28);"></div>
            <div style="display:flex;align-items:center;gap:8px;">
              <div class="bar" style="width:32px;height:7px;background:rgba(255,255,255,0.40);"></div>
              <div style="flex:1;height:8px;background:rgba(255,255,255,0.10);border-radius:999px;overflow:hidden;">
                <div class="ae-bar" style="--d:510ms; width:62%;height:100%;background:#6AB4F0;border-radius:999px;"></div>
              </div>
              <div class="bar" style="width:24px;height:7px;background:#6AB4F0;opacity:0.80;"></div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <div class="bar" style="width:36px;height:7px;background:rgba(255,255,255,0.40);"></div>
              <div style="flex:1;height:8px;background:rgba(255,255,255,0.10);border-radius:999px;overflow:hidden;">
                <div class="ae-bar" style="--d:600ms; width:38%;height:100%;background:rgba(106,180,240,0.40);border-radius:999px;"></div>

              <div class="bar" style="width:24px;height:7px;background:rgba(255,255,255,0.30);"></div>

          <!-- streak card -->
          <div class="ae" style="--d:420ms; background:#1760C0;border-radius:20px;padding:16px;width:100%;box-shadow:0 8px 20px rgba(8,32,90,0.40);display:flex;flex-direction:column;gap:10px;">

            <div id="streak-wrap" style="display:flex;gap:3px;flex-wrap:wrap;"></div>

          <!-- bottom 2-col -->
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;">
            <div class="ae" data-t="left" style="--d:510ms; background:#1760C0;border-radius:20px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 8px 20px rgba(8,32,90,0.40);">

              <div class="bar" style="width:56px;height:6px;background:rgba(106,180,240,0.60);"></div>

          <div style="height:5px;width:5px;border-radius:999px;background:rgba(255,255,255,0.25);"></div>
          <div style="height:5px;width:5px;border-radius:999px;background:rgba(255,255,255,0.25);"></div>

<script>
  /* Streak dots */
  const wrap = document.getElementById('streak-wrap');
  for (let i = 0; i < 43; i++) {
    const d = document.createElement('div');
    d.style.cssText = 'width:8px;height:8px;border-radius:2px;background:#6AB4F0;opacity:0.85;';
    wrap.appendChild(d);
  }
  for (let i = 0; i < 5; i++) {
    const d = document.createElement('div');
    d.style.cssText = 'width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,0.10);';
    wrap.appendChild(d);
  }

  /* ── Loop ── */
  const IDS      = ['s0', 's1', 's2'];
  const HOLD_MS  = 3400;   // visible time per screen
  const SLIDE_MS = 600;    // screen slide duration
  const EASE     = 'cubic-bezier(0.4, 0, 0.2, 1)';

  let current = 0;

  function el(i) { return document.getElementById(IDS[i]); }

  function slide(e, tx, op, dur) {
    e.style.transition = dur > 0
      ? `transform ${dur}ms ${EASE}, opacity ${dur}ms ${EASE}`
      : 'none';
    e.style.transform = `translateX(${tx})`;
    e.style.opacity   = String(op);
  }

  function activateScreen(e) {
    e.classList.remove('active');
    void e.offsetWidth; // force reflow — restarts CSS animations
    e.classList.add('active');
  }

  /* Init */
  slide(el(0), '0%', 1, 0);
  activateScreen(el(0));
  for (let i = 1; i < IDS.length; i++) slide(el(i), '100%', 0, 0);

  function advance() {
    const next   = (current + 1) % IDS.length;
    const curEl  = el(current);
    const nextEl = el(next);

    /* Reset incoming screen off-screen (no active class) */
    nextEl.classList.remove('active');
    slide(nextEl, '100%', 0, 0);
    void nextEl.offsetWidth;

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        /* Slide current out, next in */
        slide(curEl,  '-100%', 0, SLIDE_MS);
        slide(nextEl, '0%',    1, SLIDE_MS);

        /* Activate elements on incoming screen slightly after slide starts */
        setTimeout(() => activateScreen(nextEl), 110);

        /* Deactivate outgoing screen after it's fully off-screen */
        setTimeout(() => curEl.classList.remove('active'), SLIDE_MS + 60);
      });
    });

    current = next;
    setTimeout(advance, HOLD_MS + SLIDE_MS);
  }

  setTimeout(advance, HOLD_MS + SLIDE_MS);
</script>
</body>
