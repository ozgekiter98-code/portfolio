  <meta charset="UTF-8">

  <title>WrapChat — Abstract UI</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(165deg, #C2D2EA 0%, #AEBFDC 50%, #A6BCDA 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px 56px;
      font-family: 'Nunito Sans', sans-serif;
    }

    /* ── Phone frame ── */
    .phone-wrap {
      filter:
        drop-shadow(0 60px 100px rgba(42,65,118,0.40))
        drop-shadow(0 22px 44px rgba(42,65,118,0.22))
        drop-shadow(0 6px 14px rgba(42,65,118,0.13));
    }
    .phone-outer {
      width: 360px;
      background: linear-gradient(158deg, #F9FBFF 0%, #ECF2FA 100%);
      border-radius: 54px;
      padding: 13px;
      box-shadow:
        inset 0 0 0 1.5px rgba(255,255,255,0.97),
        inset 0 2px 10px rgba(255,255,255,0.99);
    }
    .phone-screen {
      width: 334px;
      height: 680px;
      border-radius: 42px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(180deg, #EAE6FE 0%, #F2EFFF 55%, #F8F6FF 100%);
    }

    /* ── Screen switching ── */
    .screen {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.36s ease;
      pointer-events: none;
    }
    .screen.active { opacity: 1; pointer-events: all; }

    /* ── Navigation controls ── */
    .nav-area {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 13px;
    }
    .screen-label {
      font-family: 'Nunito', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(38,58,108,0.42);
    }
    .nav-row { display: flex; align-items: center; gap: 16px; }
    .nav-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.52);
      border: 1.5px solid rgba(255,255,255,0.86);
      color: rgba(38,58,118,0.65);
      font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }
    .nav-btn:hover { background: rgba(255,255,255,0.76); transform: scale(1.06); }
    .nav-btn:disabled { opacity: 0.22; cursor: default; transform: none; }
    .dots { display: flex; gap: 7px; align-items: center; }
    .dot {
      height: 7px; width: 7px;
      border-radius: 4px;
      background: rgba(38,58,108,0.22);
      transition: all 0.24s;
      cursor: pointer;
    }
    .dot.active { width: 22px; background: rgba(38,58,108,0.52); }
  </style>
</head>

      <div class="dots">

        <div class="dot" id="dot-1"></div>
        <div class="dot" id="dot-2"></div>
      </div>
      <button class="nav-btn" id="next-btn">→</button>
    </div>
  </div>

  <script>
    const LABELS = ['01 — Home', '02 — Relationship', '03 — Report Select'];
    let current = 0;

    function show(idx) {
      ['s0', 's1', 's2'].forEach((id, i) => {
        document.getElementById(id).classList.toggle('active', i === idx);
        document.getElementById('dot-' + i).classList.toggle('active', i === idx);
      });
      document.getElementById('screen-label').textContent = LABELS[idx];
      document.getElementById('prev-btn').disabled = idx === 0;
      document.getElementById('next-btn').disabled = idx === 2;
      current = idx;
    }

    document.getElementById('prev-btn').addEventListener('click', () => show(Math.max(0, current - 1)));
    document.getElementById('next-btn').addEventListener('click', () => show(Math.min(2, current + 1)));
    ['dot-0', 'dot-1', 'dot-2'].forEach((id, i) =>
      document.getElementById(id).addEventListener('click', () => show(i))
    );
  </script>
